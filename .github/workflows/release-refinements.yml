name: Integrate final release refinements
on:
  push:
    branches: ['admin/operations-completion-20260921']
    paths: ['scripts/release-refinements.cjs', '.github/workflows/release-refinements.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin/operations-completion-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/release-refinements.cjs
      - name: Commit only the reviewed application source edits
        run: |
          git add app/api/users/route.ts app/admin/insights/page.tsx docs/release-refinements-applied.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Revoke staff sessions on access changes and bound cohort observation queries'
          git push origin HEAD:admin/operations-completion-20260921

name: Integrate operations source guards
on:
  push:
    branches: ['admin/operations-completion-20260921']
    paths: ['scripts/integrate-operations.cjs', 'scripts/finalize-operations.cjs', '.github/workflows/integrate-operations.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin/operations-completion-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Integrate reviewed application source guards only
        run: |
          node scripts/integrate-operations.cjs
          node scripts/finalize-operations.cjs
          git restore .github/workflows/platform-admin-ci.yml
      - name: Commit generated application source to review branch
        run: |
          git add app lib scripts tests docs/operations-integration-applied.txt docs/operations-finalization-applied.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate least-privilege guards and remove legacy development bypasses'
          git push origin HEAD:admin/operations-completion-20260921
      - name: Preserve generated application source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-integrated-source
          retention-days: 3
          path: |
            app/
            lib/
            scripts/
            tests/
            prisma/
            public/
            docs/
            *.json
            *.js
            *.ts
            !.env*

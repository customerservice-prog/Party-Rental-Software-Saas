name: Import reviewed rental catalog photos
on:
  push:
    branches: ['admin/operations-completion-20260921']
    paths: ['scripts/import-catalog-photos.cjs', 'scripts/catalog-photo-sources.json', '.github/workflows/import-catalog-photos.yml']
permissions:
  contents: write
jobs:
  catalog-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin/operations-completion-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/import-catalog-photos.cjs
      - name: Commit imported photos and provenance to review branch only
        run: |
          git add public/catalog-media lib/catalogPhotoManifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add reviewed-source rental product photos and provenance manifest'
          git push origin HEAD:admin/operations-completion-20260921
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-photo-review
          retention-days: 3
          path: |
            public/catalog-media/
            lib/catalogPhotoManifest.json

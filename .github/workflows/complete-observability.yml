name: Complete observability source integration
on:
  push:
    branches: ['admin/operations-completion-20260921']
    paths: ['scripts/complete-observability.cjs', '.github/workflows/complete-observability.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin/operations-completion-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/complete-observability.cjs
      - name: Commit application source changes only
        run: |
          git add app lib docs/observability-integrated.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire observed usage, photo readiness and permission-aware navigation'
          git push origin HEAD:admin/operations-completion-20260921
